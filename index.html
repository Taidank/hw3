<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HW3 Multiplcation Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="css\style.css">

</head>

<body>
    <!--Creating a bootstrap container to hold all the content-->
    <div class="container">
        <form>
            <div class="border">
                <fieldset class="compact-fieldset text-start">
                     <!--Make columns take up 4 spaces on all sizes-->
                    <div class="col-sm-4">
                         <!--top numbers of the table-->
                        <legend>Top Numbers</legend>
                         <!--Input text box-->
                        <input type="text" id="Beginning1" placeholder="Beginning Number">
                        <input type="text" id="Ending1" placeholder="Ending Number">
                         <!--Error div to allow message to pop p-->
                        <div id="error-message" class="error"></div>
                    </div>
                    <br>
                    <div class="col-sm-4">
                         <!--side numbers of the table-->
                        <legend>Side Numbers</legend>
                        <input type="text" id="Beginning2" placeholder="Beginning Number">
                        <input type="text" id="Ending2" placeholder="Ending Number">
                        <div id="error-message1" class="error"> </div>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="Checker()">Submit</button>
                    </div>
                </fieldset>
            </div>
        </form>
    </div>
    </div>
    <br>
     <!--section for the table to be able to print-->
    <div id='table'>
        <table id="multiplicationtable">
        </table>
    </div>
    </div>
 <!--Bootstrap JS-->
    <script src="js\script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
